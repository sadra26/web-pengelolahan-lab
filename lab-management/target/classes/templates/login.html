<!DOCTYPE html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Masuk - LabManager Pro</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-primary": "#ffffff",
              tertiary: "#00311f",
              "on-tertiary-fixed": "#002113",
              "on-error": "#ffffff",
              "on-error-container": "#93000a",
              error: "#ba1a1a",
              "inverse-surface": "#213145",
              "inverse-primary": "#b6c4ff",
              "on-tertiary": "#ffffff",
              "primary-container": "#1e3a8a",
              "on-primary-fixed-variant": "#264191",
              "surface-variant": "#d3e4fe",
              "on-secondary-container": "#616363",
              "tertiary-fixed-dim": "#4edea3",
              "surface-tint": "#4059aa",
              "surface-container-low": "#eff4ff",
              "on-secondary-fixed": "#1a1c1c",
              secondary: "#5d5f5f",
              "inverse-on-surface": "#eaf1ff",
              "surface-container-highest": "#d3e4fe",
              outline: "#757682",
              "primary-fixed-dim": "#b6c4ff",
              "tertiary-fixed": "#6ffbbe",
              "surface-dim": "#cbdbf5",
              "secondary-container": "#dfe0e0",
              "on-tertiary-fixed-variant": "#005236",
              "surface-container-high": "#dce9ff",
              "primary-fixed": "#dce1ff",
              "outline-variant": "#c5c5d3",
              "on-tertiary-container": "#27c38a",
              "surface-bright": "#f8f9ff",
              surface: "#f8f9ff",
              "on-secondary-fixed-variant": "#454747",
              "on-primary-container": "#90a8ff",
              "tertiary-container": "#004a31",
              "on-background": "#0b1c30",
              "on-surface": "#0b1c30",
              "error-container": "#ffdad6",
              "secondary-fixed-dim": "#c6c6c7",
              background: "#f8f9ff",
              "secondary-fixed": "#e2e2e2",
              primary: "#00236f",
              "surface-container": "#e5eeff",
              "surface-container-lowest": "#ffffff",
              "on-primary-fixed": "#00164e",
              "on-secondary": "#ffffff",
              "on-surface-variant": "#444651",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              gutter: "20px",
              xs: "4px",
              sm: "8px",
              lg: "24px",
              "container-padding-desktop": "32px",
              base: "4px",
              "container-padding-mobile": "16px",
              md: "16px",
              xl: "32px",
            },
            fontFamily: {
              "label-md": ["Be Vietnam Pro"],
              "body-lg": ["Be Vietnam Pro"],
              "headline-lg-mobile": ["Be Vietnam Pro"],
              "headline-md": ["Be Vietnam Pro"],
              "headline-sm": ["Be Vietnam Pro"],
              "body-md": ["Be Vietnam Pro"],
              "headline-lg": ["Be Vietnam Pro"],
              "body-sm": ["Be Vietnam Pro"],
              "label-sm": ["Be Vietnam Pro"],
            },
            fontSize: {

              ],

      };

    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      body {
        font-family: "Be Vietnam Pro", sans-serif;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(12px);
      }
    </style>
  </head>
  <body
    class="bg-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden"
  >
    <!-- Background Image with Overlay -->
    <div class="absolute inset-0 z-0">
      <img
        class="w-full h-full object-cover"
        data-alt="A clean and modern university computer lab interior with rows of contemporary workstations and ergonomic chairs. Large windows reveal a lush green campus courtyard under bright, natural daylight. The overall atmosphere is academic, professional, and technologically advanced, with a soft cool-toned color palette of blues, whites, and light woods."
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuCtu5nOX-bslpeFaymwlAlG7JHa-1cOupO3XbZaTS5MFkU5ISCxniQxmlq5rZzJeOE6K6N1zGZicm8gmH_Suolkboej9q_WEYjdPgG8MzPqx65jKJo6Zv5GITQVLNUI8fNi254L9rILsWChce8QMCZIDpKTfZtEckXRRiYDiH19NSrbek5d6qA72S7dkxVrg1Po8KCILfzCX40APmoV7x0QmwvowUcj_epZgKUyaibkMWkbaYPgl1HQftc0vqVu_DPcqMNDo4_gPeZL"
      />
      <div class="absolute inset-0 bg-primary/10 backdrop-blur-[2px]"></div>
    </div>
    <!-- Main Content Container -->
    <main
      class="relative z-10 w-full max-w-md px-container-padding-mobile md:px-0"
    >
      <!-- Header / Logo Section -->
      <div class="flex flex-col items-center mb-xl">
        <div
          class="bg-surface-container-lowest p-md rounded-xl shadow-md mb-md"
        >
        </div>
        <h1
          class="font-headline-lg text-headline-lg text-primary tracking-tight text-center"
        >
          LabManager UMSIDA
        </h1>
        <p class="font-body-md text-body-md text-on-surface-variant mt-xs">
          Sistem Manajemen Aset Akademik
        </p>
      </div>
      <!-- Login Card -->
      <div
        class="glass-card shadow-lg rounded-xl border border-outline-variant p-xl"
      >
        <div class="mb-lg">
    <h2 class="font-headline-sm text-headline-sm text-on-surface">
        Masuk
    </h2>

    <p class="font-body-sm text-body-sm text-on-surface-variant">
        Akses dasbor dan sumber daya laboratorium Anda
    </p>
</div>

<div th:if="${error}" class="text-red-600 text-sm mt-2">
    Username atau Password salah!
</div>

<div th:if="${logout}" class="text-green-600 text-sm mt-2">
    Anda berhasil logout.
</div>

<form action="/login" method="post" class="space-y-md">

    <!-- Username/NIM Field -->
    <div>
        <label
            class="block font-label-md text-label-md text-on-surface mb-xs"
            for="username">
            Nama Pengguna / NIM
        </label>

        <div class="relative group">
            <div
                class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
                <span class="material-symbols-outlined text-[20px]">
                    person
                </span>
            </div>

            <input
                class="block w-full pl-11 pr-md py-sm border border-outline-variant rounded-lg bg-surface text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"
                id="username"
                name="username"
                type="text"
                placeholder="Masukkan ID universitas Anda"
                required
            />
        </div>
    </div>

    <!-- Password Field -->
    <div>

        <div class="flex justify-between items-center mb-xs">

            <label
                class="block font-label-md text-label-md text-on-surface"
                for="password">
                Kata Sandi
            </label>

            <a
                href="/forgot-password"
                class="font-label-sm text-label-sm text-primary hover:underline">
                Lupa kata sandi?
            </a>

        </div>

        <div class="relative group">

            <div
                class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
                <span class="material-symbols-outlined text-[20px]">
                    lock
                </span>
            </div>

            <input
                class="block w-full pl-11 pr-11 py-sm border border-outline-variant rounded-lg bg-surface text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"
                id="password"
                name="password"
                type="password"
                placeholder="••••••••"
                required
            />

            <button
                class="absolute inset-y-0 right-0 pr-md flex items-center text-on-surface-variant hover:text-primary transition-colors"
                type="button">

                <span class="material-symbols-outlined text-[20px]">
                    visibility
                </span>

            </button>

        </div>

    </div>

    <!-- Remember Me -->
    <div class="flex items-center">

        <input
            class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded cursor-pointer"
            id="remember-me"
            name="remember-me"
            type="checkbox"
        />

        <label
            class="ml-sm block font-body-sm text-body-sm text-on-surface-variant cursor-pointer"
            for="remember-me">

            Tetap masuk

        </label>

    </div>

    <!-- Submit Button -->
    <button
        class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-sm rounded-lg shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-sm mt-lg"
        type="submit">

        Masuk

        <span class="material-symbols-outlined text-[18px]">
            login
        </span>

    </button>

    <!-- Link Register -->
    <div class="text-center mt-4">

        <span class="text-on-surface-variant">
            Belum punya akun?
        </span>

        <a
            href="/register"
            class="text-primary font-semibold hover:underline">

            Daftar

        </a>

    </div>

</form>
        <!-- SSO / Alternative Auth -->

    <!-- Micro-interaction Scripts -->
    <script>
      // Password Visibility Toggle
      const passwordInput = document.getElementById("password");
      const toggleBtn = passwordInput.nextElementSibling;

      toggleBtn.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        toggleBtn.children[0].textContent = isPassword
          ? "visibility_off"
          : "visibility";
      });

      // Atmospheric parallax effect on background
      document.addEventListener("mousemove", (e) => {
        const img = document.querySelector(".absolute.inset-0 img");
        const x = (window.innerWidth - e.pageX * 2) / 100;
        const y = (window.innerHeight - e.pageY * 2) / 100;
        img.style.transform = `scale(1.1) translate(${x}px, ${y}px)`;
      });
    </script>

  </body>
</html>
